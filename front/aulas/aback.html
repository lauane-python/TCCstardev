</head>
<body class="body_index_cadastro">
    <!-- HEADER -->
    <header class="header_index_cadastro">
        <figure class="logo">
            <a href="/front/index.html" target="_self" class="hrefs"><img src="/front/img/logo.svg" alt="Logotipo StarDev"></a>
        </figure>
        <nav>
            <figure class="ftichome">

    <main>
        <section class="carrossel-container">

            <section class="carrossel drag" aria-label="Matérias da StarDev" >

            <section
                id="listaAulas"
                class="listaAulas"
            >
                <p>Carregando aulas...</p>
            </section>
        </section>

    <script src="/front/js/aulas.js"></script>
    <!-- CHATBOT -->
    <div id="chatbot_container"></div>
    <script>
    fetch("/front/chatfront/components/chatbot.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById(
            "chatbot_container"
        ).innerHTML = data;
        const script =
            document.createElement("script");
        script.src =
            "/front/chatfront/js/chatbot.js";
        document.body.appendChild(script);

    });
    </script>
