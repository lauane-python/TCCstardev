<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro-StarDev</title>
  <link rel="stylesheet" href="/front/style.css">
  <link rel="icon" type="image/x-icon" href="/front/img/favicon.ico">
</head>
<body id="body_index_cadastro">
    <header id="header_index_cadastro">
        <figure class="logo">
            <a href="/front/index.html" target="_self" class="hrefs"><img src="/front/img/logo.svg" alt="LOGOTIPO StarDev" href="/front/index.html"></a>
        </figure>
        <nav>
            <a href="/front/cadastro.html">CADASTRA-SE</a>
            <a href="/front/login.html">LOGIN</a>
        </nav>
    </header>
    <main>
        <section id="section_total_cadastro">
            <section id="img_logoflu_cadastro">
                <figure>
                    <img src="/front/img/logoflu.svg" alt="LOGOTIPO STARDEV" class="logoflu">
                </figure>
            </section>
            <section>
                <h1 id="h1_cadastro">Cadastra-se</h1>
                <br>
                <section id="section_cadastro">
                    <label for="nome" id="label_nome">Nome</label>
                    <br>
                    <input type="text" id="input_nome" name="nome" autocomplete="name"
                        placeholder="Digite seu nome completo">
                    <br>
                    <label for="email" id="label_email">E-mail</label>
                    <br>
                    <input type="email" id="input_email" name="email" autocomplete="email"
                        placeholder="Digite seu e-mail favorito">
                    <br>
                    <label for="telefone" type="tel" id="label_telefone">Telefone</label>
                    <br>
                    <input type="text" id="input_telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
                    <br>
                    <label for="senha" id="label_senha">Senha</label>
                    <br>
                    <input type="password" id="input_senha" name="senha" autocomplete="new-password"
                        placeholder="Digite sua senha">
                    <br>
                    <button type="submit" class="button" id="btn_salvar_cadastro">Cadastrar</button>
                    <br>
                    <p>Já tem uma conta? <a href="/front/login.html" target="_self" class="hrefs">Clique aqui</a></p>
                </section>
            </section>
        </section>
    </main>
    <footer id="footer_index_cadastro">
        <p><a href="/front/index.html" target="_self" class="hrefs"><strong>StarDev</strong></a></p>
        <p class="paragrafo-footer">&copy 2026 StarDev. Todos os direitos reservados.</p>
    </footer>
    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const senhaRegex =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,}$/;

        const telefoneRegex = /^\d{10,11}$/;

       
        document.getElementById("btn_salvar_cadastro").addEventListener("click", async () => {

        const nome = document.getElementById("input_nome").value.trim();
        const email = document.getElementById("input_email").value.trim();
        const telefone = document.getElementById("input_telefone").value.replace(/\D/g, "");
        const senha = document.getElementById("input_senha").value;

        if (nome === "") {
            alert("Digite seu nome.");
            return;
        }

        if (!emailRegex.test(email)) {
            alert("Digite um email válido.");
            return;
        }

        if (!telefoneRegex.test(telefone)) {
            alert("Digite um telefone válido.");
            return;
        }

        if (!senhaRegex.test(senha)) {
            alert("A senha deve conter no mínimo 8 caracteres, letra maiúscula, minúscula, número e caractere especial.");
            return;
        }

        try {

            const resposta = await fetch("http://10.111.9.27:3000/cadastro", {
                method: "POST",
                headers:{
                    "Accept":"application/json",
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    nome,
                    email,
                    senha,
                    telefone
                })
            });

            const dados = await resposta.json();

            alert(dados.resposta);
            
        } catch (erro) {
            console.error(erro);
            alert("Erro ao conectar com o servidor.");
        }

    });
    </script>
</body>
</html>
