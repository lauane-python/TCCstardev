<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro-StarDev</title>
  <link rel="stylesheet" href="/front/style.css">
  <link rel="icon" type="image/x-icon" href="/front/img/favicon.ico">
</head>
<body class="body_index_cadastro">
    <header class="header_index_cadastro">
        <figure class="logo">
            <a href="/front/index.html" target="_self" class="hrefs"><img src="/front/img/logo.svg" alt="LOGOTIPO StarDev" href="/front/index.html"></a>
        </figure>
        <nav>
            <a href="/front/cadastro.html">CADASTRA-SE</a>
            <a href="/front/login.html">LOGIN</a>
        </nav>
    </header>
    <main>
        <section id="section_total_cadastro">
            <section id="img_logoflu_cadastro">
                <figure>
                    <img src="/front/img/logoflu.svg" alt="LOGOTIPO STARDEV" class="logoflu">
                </figure>
            </section>
            <section>
                <h1 id="h1_cadastro">Cadastra-se</h1>
                <br>
                <section id="section_cadastro">
                    <label for="nome" id="label_nome">Nome</label>
                    <br>
                    <input type="text" id="input_nome" name="nome" autocomplete="name"
                        placeholder="Digite seu nome completo">
                    <br>
                    <label for="email" id="label_email">E-mail</label>
                    <br>
                    <input type="email" id="input_email" name="email" autocomplete="email"
                        placeholder="Digite seu e-mail favorito">
                    <br>
                    <label for="telefone" type="tel" id="label_telefone">Telefone</label>
                    <br>
                    <input type="tel" id="input_telefone" name="telefone" placeholder="+55 (00) 00000-0000" maxlength="19" inputmode="numeric">
                    <br>
                    <label for="senha" id="label_senha">Senha</label>
                    <br>
                    <div id="wrapper_senha" class="wrapper-senha">
                        <input type="password" id="input_senha" name="senha" autocomplete="new-password"
                            placeholder="Digite sua senha">
                        <button type="button" id="btn_toggle_senha" class="btn-toggle-senha" aria-label="Mostrar senha" tabindex="-1">
                            <svg id="icon_olho_aberto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="icon_olho_fechado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.9 18.9 0 0 1 5.06-5.94"></path>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <br>
                    <button type="submit" class="button" id="btn_salvar_cadastro">Cadastrar</button>
                    <br>
                    <p>Já tem uma conta? <a href="/front/login.html" target="_self" class="hrefs">Clique aqui</a></p>
                </section>
            </section>
        </section>
    </main>
    <footer id="footer_index_cadastro">
        <p><a href="/front/index.html" target="_self" class="hrefs"><strong>StarDev</strong></a></p>
        <p class="paragrafo-footer">&copy 2026 StarDev. Todos os direitos reservados.</p>
    </footer>
    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const senhaRegex =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,}$/;
        const nomeRegex = /^[A-Za-zÀ-ÿ\s]+$/;
        const telefoneRegex = /^\d{10,11}$/;

        // --- Máscara automática do telefone: +55 (DD) DDDDD-DDDD ---
        const inputTelefone = document.getElementById("input_telefone");

        function mascaraTelefone(digitos) {
            digitos = digitos.slice(0, 11); // DDD + até 9 dígitos
            const ddd = digitos.slice(0, 2);
            const resto = digitos.slice(2);

            let parte1 = resto;
            let parte2 = "";
            if (resto.length > 4) {
                parte1 = resto.slice(0, resto.length - 4);
                parte2 = resto.slice(resto.length - 4);
            }

            let resultado = "+55";
            if (ddd.length > 0) {
                resultado += " (" + ddd + (ddd.length === 2 ? ")" : "");
            }
            if (parte1.length > 0) {
                resultado += (ddd.length === 2 ? " " : "") + parte1;
            }
            if (parte2.length > 0) {
                resultado += "-" + parte2;
            }
            return resultado;
        }

        inputTelefone.addEventListener("input", () => {
            let digitos = inputTelefone.value.replace(/\D/g, "");
            // remove o "55" do prefixo fixo que já aparece no campo
            if (digitos.startsWith("55")) {
                digitos = digitos.slice(2);
            }
            inputTelefone.value = mascaraTelefone(digitos);
        });

        inputTelefone.addEventListener("focus", () => {
            if (inputTelefone.value.trim() === "") {
                inputTelefone.value = "+55 (";
            }
        });

        inputTelefone.addEventListener("blur", () => {
            const digitos = inputTelefone.value.replace(/\D/g, "").replace(/^55/, "");
            if (digitos.length === 0) {
                inputTelefone.value = "";
            }
        });

        // --- Mostrar/ocultar senha ---
        const inputSenha = document.getElementById("input_senha");
        const btnToggleSenha = document.getElementById("btn_toggle_senha");
        const iconOlhoAberto = document.getElementById("icon_olho_aberto");
        const iconOlhoFechado = document.getElementById("icon_olho_fechado");

        btnToggleSenha.addEventListener("click", () => {
            const mostrando = inputSenha.type === "text";
            inputSenha.type = mostrando ? "password" : "text";
            iconOlhoAberto.style.display = mostrando ? "block" : "none";
            iconOlhoFechado.style.display = mostrando ? "none" : "block";
            btnToggleSenha.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
        });

        document.getElementById("btn_salvar_cadastro").addEventListener("click", async () => {

        const nome = document.getElementById("input_nome").value.trim();
        const email = document.getElementById("input_email").value.trim();
        // envia só o número nacional (DDD + número), sem o "55" do prefixo do país
        const telefone = document.getElementById("input_telefone").value.replace(/\D/g, "").replace(/^55/, "");
        const senha = document.getElementById("input_senha").value;

        if (nome === "") {
            alert("Digite seu nome.");
            return;
        }
        
        if (!nomeRegex.test(nome)) {
            alert("Digite um nome coretamente");
            return;
        }

        if (!emailRegex.test(email)) {
            alert("Digite um email válido.");
            return;
        }

        if (!telefoneRegex.test(telefone)) {
            alert("Digite um telefone válido.");
            return;
        }

        if (!senhaRegex.test(senha)) {
            alert("A senha deve conter no mínimo 8 caracteres, letra maiúscula, minúscula, número e caractere especial.");
            return;
        }
       

    

        try {

            const resposta = await fetch("http://10.111.9.9:3000/cadastro", {
                method: "POST",
                headers:{
                    "Accept":"application/json",
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    nome,
                    email,
                    senha,
                    telefone
                })
            });

            const dados = await resposta.json();

            alert(dados.resposta);
            
        } catch (erro) {
            console.error(erro);
            alert("Erro ao conectar com o servidor.");
        }

    });
    </script>
</body>
</html>
