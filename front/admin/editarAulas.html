<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Video au StarDev</title>
    <link rel="stylesheet" href="/front/style.css">
    <link
        rel="icon"
        type="image/x-icon"
        href="/front/img/favicon.ico"
    >
    <style>
        /* =====================================================
           PÁGINA DE EDITAR VIDEOAULAS
        ===================================================== */
        #body_editar_videoaulas {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #d19283,
                    #e6b2a6,
                    #eccc6e
                );
            font-family: "Josefin Sans", sans-serif;
            color: #804256;
        }
        /* =====================================================
           CONTEÚDO
        ===================================================== */
        .editar-container {
            width: 90%;
            max-width: 1150px;
            margin: 0 auto;
            padding: 45px 0 60px;
        }
        .editar-titulo {
            text-align: center;
            margin-bottom: 30px;
        }
        .editar-titulo h1 {
            margin: 0 0 10px;
            color: #f2e9e1;
            font-size: 34px;
        }
        .editar-titulo p {
            margin: 0;
            color: #f2e9e1;
            font-size: 17px;
        }
        /* =====================================================
           ÁREA DE PESQUISA
        ===================================================== */
        .filtros-videoaulas {
            background: #f2e9e1;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 15px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .filtros-videoaulas input,
        .filtros-videoaulas select {
            width: 100%;
            height: 45px;
            padding: 0 14px;
            border: 2px solid #d19283;
            border-radius: 10px;
            background: #fff;
            color: #804256;
            outline: none;
            font-size: 15px;
        }
        .filtros-videoaulas input:focus,
        .filtros-videoaulas select:focus {
            border-color: #804256;
        }
        /* =====================================================
           LISTA
        ===================================================== */
        #listaVideoaulas {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* =====================================================
           CARD
        ===================================================== */
        .videoaula-card {
            background: #f2e9e1;
            border-radius: 15px;
            padding: 25px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            gap: 25px;
            transition: 0.3s;
        }
        .videoaula-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.2);
        }
        .videoaula-info {
            flex: 1;
            min-width: 0;
        }
        /* MATÉRIA */
        .videoaula-materia {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #804256;
            color: #f2e9e1;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        /* NOME */
        .videoaula-info h2 {
            margin: 0 0 10px;
            color: #804256;
            font-size: 22px;
        }
        /* DESCRIÇÃO */
        .videoaula-descricao {
            color: #716f35;
            line-height: 1.5;
            margin: 0 0 15px;
        }
        /* LINK */
        .videoaula-link {
            display: inline-block;
            max-width: 100%;
            color: #a56940;
            font-weight: bold;
            text-decoration: none;
            word-break: break-all;
        }
        .videoaula-link:hover {
            text-decoration: underline;
        }
        /* =====================================================
           BOTÕES
        ===================================================== */
        .videoaula-acoes {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            min-width: 120px;
        }
        .btn-videoaula {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-editar-video {
            background: #716f35;
            color: #f2e9e1;
        }
        .btn-editar-video:hover {
            background: #5c5b2b;
        }
        .btn-excluir-video {
            background: #804256;
            color: #f2e9e1;
        }
        .btn-excluir-video:hover {
            background: #a56940;
        }
        .btn-ver-video {
            background: #eccc6e;
            color: #804256;
        }
        .btn-ver-video:hover {
            background: #db9a8f;
        }
        /* =====================================================
           MENSAGEM
        ===================================================== */
        .mensagem-videoaulas {
            background: #f2e9e1;
            border-radius: 15px;
            padding: 35px;
            text-align: center;
            color: #804256;
            font-size: 17px;
        }
        /* =====================================================
           MODAL
        ===================================================== */
        #modalEditarVideo {
            position: fixed;
            inset: 0;
            background: rgba(60, 30, 35, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        #modalEditarVideo.ativo {
            display: flex;
        }
        .modal-video-conteudo {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background: #f2e9e1;
            border-radius: 15px;
            padding: 30px;
            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.3);
        }
        .modal-video-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        .modal-video-topo h2 {
            margin: 0;
            color: #804256;
        }
        .btn-fechar-modal {
            border: none;
            background: transparent;
            color: #804256;
            font-size: 30px;
            cursor: pointer;
            padding: 0;
        }
        .campo-video {
            margin-bottom: 18px;
        }
        .campo-video label {
            display: block;
            margin-bottom: 7px;
            color: #804256;
            font-weight: bold;
        }
        .campo-video input,
        .campo-video select,
        .campo-video textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #d19283;
            border-radius: 10px;
            background: #fff;
            color: #804256;
            outline: none;
            font-family: inherit;
            font-size: 15px;
        }
        .campo-video textarea {
            min-height: 130px;
            resize: vertical;
        }
        .campo-video input:focus,
        .campo-video select:focus,
        .campo-video textarea:focus {
            border-color: #804256;
        }
        .modal-video-acoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }
        .btn-cancelar {
            background: #db9a8f;
            color: #804256;
        }
        .btn-salvar {
            background: #716f35;
            color: #f2e9e1;
        }
        /* =====================================================
           RESPONSIVIDADE
        ===================================================== */
        @media (max-width: 800px) {
            .filtros-videoaulas {
                grid-template-columns: 1fr;
            }
            .videoaula-card {
                flex-direction: column;
            }
            .videoaula-acoes {
                display: grid;
                grid-template-columns:
                    repeat(3, 1fr);
                width: 100%;
            }
        }
        @media (max-width: 600px) {
            .editar-container {
                width: 92%;
                padding-top: 30px;
            }
            .editar-titulo h1 {
                font-size: 27px;
            }
            .editar-titulo p {
                font-size: 15px;
            }
            .videoaula-card {
                padding: 18px;
            }
            .videoaula-info h2 {
                font-size: 19px;
            }
            .videoaula-acoes {
                grid-template-columns: 1fr;
            }
            .modal-video-conteudo {
                padding: 22px;
            }
        }
    </style>
</head>
<body id="body_editar_videoaulas">
    <!-- =====================================================
         HEADER
    ====================================================== -->
    <header class="header_index_cadastro">
        <h2>
            Dashboard Administrativo
        </h2>
        <nav>
            <a href="/front/admin/feedback.html">
                Feedbacks
            </a>
            <a href="/front/admin/editarAulas.html">
                Editar
            </a>
            <a href="/front/admin/listarAulas.html">
                Listar Aulas
            </a>
            <a href="/front/admin/admin.html">
                Administrador
            </a>
            <a
                href="/front/index.html"
                onclick="logout()"
            >
                Index
            </a>
        </nav>
    </header>
    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->
    <main>
        <div class="editar-container">
            <section class="editar-titulo">
                <h1>
                    Editar Videoaulas
                </h1>
                <p>
                    Gerencie as aulas disponíveis para os alunos.
                </p>
            </section>
            <!-- =================================================
                 FILTROS
            ================================================== -->
            <section class="filtros-videoaulas">
                <input
                    type="text"
                    id="pesquisaVideo"
                    placeholder="Pesquisar videoaula..."
                >
                <select id="filtroMateria">
                    <option value="">
                        Todas as matérias
                    </option>
                </select>
            </section>
            <!-- =================================================
                 LISTA
            ================================================== -->
            <section id="listaVideoaulas">
                <div class="mensagem-videoaulas">
                    Carregando videoaulas...
                </div>
            </section>
        </div>
    </main>
    <!-- =====================================================
         MODAL DE EDIÇÃO
    ====================================================== -->
    <div id="modalEditarVideo">
        <div class="modal-video-conteudo">
            <div class="modal-video-topo">
                <h2>
                    Editar Videoaula
                </h2>
                <button
                    class="btn-fechar-modal"
                    type="button"
                    onclick="fecharModal()"
                >
                    ×
                </button>
            </div>
            <form id="formEditarVideo">
                <input
                    type="hidden"
                    id="idMaterias"
                >
                <div class="campo-video">
                    <label for="nomeAula">
                        Nome da aula
                    </label>
                    <input
                        type="text"
                        id="nomeAula"
                        required
                    >
                </div>
                <div class="campo-video">
                    <label for="materiaAula">
                        Matéria
                    </label>
                    <select
                        id="materiaAula"
                        required
                    >
                        <option value="">
                            Selecione uma matéria
                        </option>
                    </select>
                </div>
                <div class="campo-video">
                    <label for="linkAula">
                        Link do vídeo
                    </label>
                    <input
                        type="url"
                        id="linkAula"
                        placeholder="https://www.youtube.com/..."
                        required
                    >
                </div>
                <div class="campo-video">
                    <label for="descricaoAula">
                        Descrição
                    </label>
                    <textarea
                        id="descricaoAula"
                        required
                    ></textarea>
                </div>
                <div class="modal-video-acoes">
                    <button
                        type="button"
                        class="btn-videoaula btn-cancelar"
                        onclick="fecharModal()"
                    >
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        class="btn-videoaula btn-salvar"
                    >
                        Salvar alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->
    
</body>
<script>
    const nivel = localStorage.getItem("nivel");
    if (nivel !== "A") {
        alert("Acesso negado");
        window.location.href =
            "../login.html";
    }
    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("nivel");
        window.location.href =
            "../login.html";
    }
    let videoaulas = [];
    let aulas = [];
    const API = "http://10.111.9.56:3000";
        /* =================================================
           CARREGAR VIDEOAULAS
        ================================================= */
    async function carregarVideoaulas() {
        try {
            const resposta =
                await fetch(`${API}/videoaulas`, {
                    headers: {
                        "Authorization":
                            `Bearer ${localStorage.getItem("token")}`
                    }
                });
            if (!resposta.ok) {
                throw new Error(
                    "Erro ao carregar videoaulas"
                );
            }
            videoaulas =
                await resposta.json();
            mostrarVideoaulas();
        } catch (erro) {
            console.error(erro);
            document.getElementById(
                "listaVideoaulas"
            ).innerHTML = `
                <div class="mensagem-videoaulas">
                    Não foi possível carregar as videoaulas.
                </div>
            `;
        }
    }
        /* =================================================
           CARREGAR MATÉRIAS
        ================================================= */
    async function carregarMaterias() {
        try {

            const resposta = await fetch("http://10.111.9.56:3000/aulas");

            if (!resposta.ok) {
                throw new Error("Erro ao buscar matérias");
            }

            const dados = await resposta.json();

            console.log("MATÉRIAS RECEBIDAS:", dados);

            aulas = dados;

            preencherMaterias();

        } catch (erro) {

            console.error("ERRO NAS MATÉRIAS:", erro);

        }
    }
        /* =================================================
           PREENCHER MATÉRIAS
        ================================================= */
    function preencherMaterias() {
        const filtro =
            document.getElementById(
                "filtroMateria"
            );
        const select =
            document.getElementById(
                "materiaAula"
            );
        aulas.forEach(aula => {
            const opcaoFiltro =
                document.createElement("option");
            opcaoFiltro.value =
                aula.id_aula;
            opcaoFiltro.textContent =
                aula.materia;
            filtro.appendChild(
                opcaoFiltro
            );
            const opcaoSelect =
                document.createElement("option");
            opcaoSelect.value =
                aula.id_aula;
            opcaoSelect.textContent =
                aula.materia;
            select.appendChild(
                opcaoSelect
            );
        });
    }
        /* =================================================
           MOSTRAR VIDEOAULAS
        ================================================= */
    function mostrarVideoaulas() {
        const lista =
            document.getElementById(
                "listaVideoaulas"
            );
        const pesquisa =
            document.getElementById(
                "pesquisaVideo"
            )
            .value
            .toLowerCase()
            .trim();
        const materia =
            document.getElementById(
                "filtroMateria"
            ).value;
        const resultados =
            videoaulas.filter(video => {
                const nome =
                    (video.nome_aulas || "")
                    .toLowerCase();
                const descricao =
                        (video.descricao || "")
                        .toLowerCase();
                const nomeMateria =
                    (video.materia || "")
                    .toLowerCase();
                const correspondePesquisa =
                    nome.includes(pesquisa)
                    ||
                    descricao.includes(pesquisa)
                    ||
                    nomeMateria.includes(pesquisa);
                const correspondeMateria =
                    materia === ""
                    ||
                    String(video.id_aula) ===
                    String(materia);
                return (
                    correspondePesquisa
                    &&
                    correspondeMateria
                );
            });
        if (resultados.length === 0) {
            lista.innerHTML = `
                <div class="mensagem-videoaulas">
                    Nenhuma videoaula encontrada.
                </div>
            `;
            return;
        }
        lista.innerHTML = "";
        resultados.forEach(video => {
            const card =
                document.createElement("article");
            card.className =
                "videoaula-card";
            card.innerHTML = `
                <div class="videoaula-info">
                    <span class="videoaula-materia">
                        ${video.materia || "Sem matéria"}
                    </span>
                    <h2>
                        ${video.nome_aulas}
                    </h2>
                    <p class="videoaula-descricao">
                        ${video.descricao || "Sem descrição"}
                    </p>
                    <a
                    class="videoaula-link"
                        href="${video.link}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🔗 Ver vídeo
                    </a>
                </div>
                <div class="videoaula-acoes">
                    <button
                        class="btn-videoaula btn-ver-video"
                        onclick="abrirVideo('${video.link}')"
                    >
                        Ver
                    </button>
                    <button
                        class="btn-videoaula btn-editar-video"
                        onclick="abrirModal(${video.id_materias})"
                    >
                        Editar
                    </button>
                    <button
                        class="btn-videoaula btn-excluir-video"
                        onclick="excluirVideo(${video.id_materias})"
                    >
                        Excluir
                    </button>
                </div>
            `;
            lista.appendChild(card);
        });
    }
        /* =================================================
           ABRIR VÍDEO
        ================================================= */
    function abrirVideo(link) {
        window.open(
            link,
            "_blank"
        );
    }
        /* =================================================
           ABRIR MODAL
        ================================================= */
    function abrirModal(id) {
        const video =
            videoaulas.find(
                item =>
                    item.id_materias == id
            );
        if (!video) {
            alert(
                "Videoaula não encontrada."
            );
            return;
        }
        document.getElementById(
            "idMaterias"
        ).value =
            video.id_materias;
        document.getElementById(
            "nomeAula"
        ).value =
            video.nome_aulas;
        document.getElementById(
            "materiaAula"
        ).value =
            video.id_aula;
        document.getElementById(
            "linkAula"
        ).value =
            video.link;
        document.getElementById(
            "descricaoAula"
        ).value =
            video.descricao;
        document.getElementById(
            "modalEditarVideo"
        ).classList.add(
            "ativo"
        );
    }
        /* =================================================
           FECHAR MODAL
        ================================================= */
    function fecharModal() {
        document.getElementById(
            "modalEditarVideo"
        ).classList.remove(
            "ativo"
        );
    }
        /* =================================================
           SALVAR EDIÇÃO
        ================================================= */
    document
        .getElementById(
            "formEditarVideo"
        )
        .addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();
                const id =
                    document.getElementById(
                        "idMaterias"
                    ).value;
                const dados = {
                    nome_aulas:
                        document.getElementById(
                            "nomeAula"
                        ).value.trim(),
                    descricao:
                        document.getElementById(
                            "descricaoAula"
                        ).value.trim(),
                    link:
                        document.getElementById(
                            "linkAula"
                        ).value.trim(),
                    id_aula:
                        document.getElementById(
                            "materiaAula"
                        ).value
                };
                try {
                    const resposta =
                        await fetch(
                            `/videoaulas/${id}`,
                                {
                                    method: "PUT",
                                    headers: {
                                        "Content-Type":
                                            "application/json",
                                        "Authorization":
                                            `Bearer ${localStorage.getItem("token")}`
                                    },
                                    body:
                                        JSON.stringify(
                                            dados
                                        )
                                }
                        );
                    const resultado =
                        await resposta.json();
                    if (!resposta.ok) {
                        alert(
                            resultado.message ||
                            "Erro ao atualizar videoaula."
                        );
                        return;
                    }
                    alert(
                        "Videoaula atualizada com sucesso!"
                    );
                    fecharModal();
                    await carregarVideoaulas();
                } catch (erro) {
                    console.error(erro);
                    alert(
                        "Erro ao conectar com o servidor."
                    );
                }
            }
        );
        /* =================================================
           EXCLUIR
        ================================================= */
    async function excluirVideo(id) {
        const confirmar =
            confirm(
                "Tem certeza que deseja excluir esta videoaula?"
            );
        if (!confirmar) {
            return;
        }
        try {
            const resposta =
                await fetch(
                    `${API}/videoaulas/${id}`,

                    {
                        method: "DELETE",
                        headers: {
                            "Authorization":
                                `Bearer ${localStorage.getItem("token")}`
                        }
                    }
                );
            const resultado =
                await resposta.json();
            if (!resposta.ok) {
                alert(
                    resultado.message ||
                    "Erro ao excluir videoaula."
                );
                return;
            }
            alert(
                "Videoaula excluída com sucesso!"
            );
            await carregarVideoaulas();
        } catch (erro) {
            console.error(erro);
            alert(
                "Erro ao conectar com o servidor."
            );
        }
    }
        /* =================================================
           FILTROS
        ================================================= */
    document
        .getElementById(
            "pesquisaVideo"
        )
        .addEventListener(
            "input",
            mostrarVideoaulas
        );
    document
        .getElementById(
            "filtroMateria"
        )
        .addEventListener(
            "change",
            mostrarVideoaulas
        );
        /* =================================================
           FECHAR MODAL CLICANDO FORA
        ================================================= */
    document
        .getElementById(
            "modalEditarVideo"
        )
        .addEventListener(
            "click",
            function (event) {
                if (
                    event.target === this
                ) {
                    fecharModal();
                }
            }
        );
        /* =================================================
           ESC PARA FECHAR
        ================================================= */
    document.addEventListener(
        "keydown",
        function (event) {
            if (
                event.key === "Escape"
            ) {
                fecharModal();
            }
        }
    );
        /* =================================================
           INICIAR
        ================================================= */
    carregarMaterias();
    carregarVideoaulas();
</script>
</html>
